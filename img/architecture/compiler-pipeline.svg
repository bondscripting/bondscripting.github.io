<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
<title>The Bond compiler pipeline</title>
<style>
text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #202020; }
.c { text-anchor: middle; }
.b { font-weight: bold; }
.s { font-size: 11px; fill: #404040; }
.box { fill: #FFFFFF; stroke: #304860; stroke-width: 1.5; }
.panel { fill: #EEF2F7; stroke: #304860; stroke-width: 1.5; }
.file { fill: #E8E8E0; stroke: #606060; stroke-width: 1.2; }
.line { stroke: #304860; stroke-width: 1.5; fill: none; }
.dash { stroke-dasharray: 5 4; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#304860"/>
</marker>
</defs>

<!-- Input -->
<rect class="file" x="10" y="75" width="110" height="50" rx="3"/>
<text class="c b" x="65" y="97">.bond</text>
<text class="c s" x="65" y="114">source files</text>

<!-- FrontEnd -->
<rect class="panel" x="150" y="30" width="430" height="150" rx="6"/>
<text class="b" x="164" y="52">FrontEnd</text>

<rect class="box" x="170" y="75" width="100" height="50" rx="4"/>
<text class="c b" x="220" y="97">Lexer</text>
<text class="c s" x="220" y="114">tokens</text>

<rect class="box" x="300" y="75" width="100" height="50" rx="4"/>
<text class="c b" x="350" y="97">Parser</text>
<text class="c s" x="350" y="114">parse trees</text>

<rect class="box" x="430" y="75" width="130" height="50" rx="4"/>
<text class="c b" x="495" y="97">SemanticAnalyzer</text>
<text class="c s" x="495" y="114">5 analysis passes</text>

<text class="c s" x="365" y="152">Source files and their includes are opened through a StreamFactory.</text>
<text class="c s" x="365" y="168">Errors are collected in a CompilerErrorBuffer.</text>

<line class="line" x1="120" y1="100" x2="168" y2="100" marker-end="url(#arrow)"/>
<line class="line" x1="270" y1="100" x2="298" y2="100" marker-end="url(#arrow)"/>
<line class="line" x1="400" y1="100" x2="428" y2="100" marker-end="url(#arrow)"/>

<!-- Back end -->
<rect class="box" x="620" y="75" width="120" height="50" rx="4"/>
<text class="c b" x="680" y="97">CodeGenerator</text>
<text class="c s" x="680" y="114">bytecode</text>
<line class="line" x1="580" y1="100" x2="618" y2="100" marker-end="url(#arrow)"/>

<rect class="file" x="780" y="75" width="105" height="50" rx="3"/>
<text class="c b" x="832" y="97">.cbo</text>
<text class="c s" x="832" y="114">compiled bytecode</text>
<line class="line" x1="740" y1="100" x2="778" y2="100" marker-end="url(#arrow)"/>

<!-- Optional binding generation -->
<path class="line dash" d="M580,150 H680 V203" marker-end="url(#arrow)"/>
<text class="s" x="688" y="180">optional (bondc -b -c -h -i)</text>

<rect class="box" x="620" y="205" width="120" height="50" rx="4"/>
<text class="c b" x="680" y="226">NativeBinding</text>
<text class="c b" x="680" y="243">Generator</text>

<rect class="file" x="780" y="205" width="105" height="50" rx="3"/>
<text class="c b" x="832" y="226">.h / .cpp</text>
<text class="c s" x="832" y="243">native bindings</text>
<line class="line" x1="740" y1="230" x2="778" y2="230" marker-end="url(#arrow)"/>
</svg>
