<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
<title>VM stack frames, collectors and the host stack</title>
<style>
text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #202020; }
.c { text-anchor: middle; }
.e { text-anchor: end; }
.b { font-weight: bold; }
.s { font-size: 11px; fill: #404040; }
.args { fill: #DCE4EE; stroke: #304860; stroke-width: 1.2; }
.locals { fill: #C9D6E6; stroke: #304860; stroke-width: 1.2; }
.ops { fill: #E8E8E0; stroke: #304860; stroke-width: 1.2; }
.free { fill: #FFFFFF; stroke: #304860; stroke-width: 1.2; stroke-dasharray: 5 4; }
.coll { fill: #F6E3C8; stroke: #304860; stroke-width: 1.2; }
.host { fill: #EEEEEE; stroke: #606060; stroke-width: 1.2; }
.line { stroke: #304860; stroke-width: 1.5; fill: none; }
.thin { stroke: #808080; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#304860"/>
</marker>
</defs>

<!-- VM stack -->
<text class="c b" x="220" y="24">VM stack (fixed size)</text>
<text class="s" x="335" y="48">end of stack</text>
<rect class="free" x="110" y="40" width="220" height="160"/>
<text class="c s" x="220" y="115">unused</text>
<text class="c s" x="220" y="131">(grows upward)</text>

<rect class="ops" x="110" y="200" width="220" height="45"/>
<text class="c" x="220" y="227">operand stack</text>
<rect class="locals" x="110" y="245" width="220" height="45"/>
<text class="c" x="220" y="272">local variables</text>
<rect class="args" x="110" y="290" width="220" height="30"/>
<text class="c" x="220" y="310">arguments (pushed by main)</text>

<rect class="ops" x="110" y="320" width="220" height="45"/>
<text class="c" x="220" y="347">operand stack</text>
<rect class="locals" x="110" y="365" width="220" height="45"/>
<text class="c" x="220" y="392">local variables</text>
<rect class="args" x="110" y="410" width="220" height="30"/>
<text class="c" x="220" y="430">arguments</text>
<text class="s" x="335" y="440">start of stack</text>

<!-- Frame brackets -->
<path class="line" d="M102,202 H94 V318 H102"/>
<text class="e b" x="88" y="258">Foo()</text>
<text class="e s" x="88" y="274">top frame</text>
<path class="line" d="M102,322 H94 V438 H102"/>
<text class="e b" x="88" y="384">main()</text>

<!-- Collector -->
<line class="line" x1="330" y1="268" x2="378" y2="268" marker-end="url(#arrow)"/>
<rect class="coll" x="380" y="250" width="160" height="36" rx="4"/>
<text class="c b" x="460" y="273">Collector of Foo()</text>
<text class="c s" x="460" y="304">frees AllocateCollected memory</text>
<text class="c s" x="460" y="319">and collected streams when</text>
<text class="c s" x="460" y="334">Foo() returns or unwinds</text>

<!-- Host stack -->
<text class="c b" x="740" y="24">Host thread's C++ stack</text>
<rect class="free" x="630" y="40" width="220" height="210"/>
<rect class="host" x="630" y="250" width="220" height="60"/>
<text class="c" x="740" y="275">InvokeFunction +</text>
<text class="c" x="740" y="292">ExecuteScriptFunction (Foo)</text>
<rect class="host" x="630" y="310" width="220" height="60"/>
<text class="c" x="740" y="335">InvokeFunction +</text>
<text class="c" x="740" y="352">ExecuteScriptFunction (main)</text>
<rect class="host" x="630" y="370" width="220" height="70"/>
<text class="c" x="740" y="398">Host code calling</text>
<text class="c" x="740" y="415">vm.CallFunction("main")</text>
<path class="thin" d="M540,268 H628"/>
<path class="thin" d="M330,384 H600 V340 H628"/>

<!-- Notes -->
<text class="c s" x="440" y="472">Before each call, the VM checks that the callee's locals and its maximum operand stack depth (computed by the compiler)</text>
<text class="c s" x="440" y="488">fit in the VM stack, and throws a Bond::Exception ("Stack overflow") if they do not. Each Bond call also nests a C++ call.</text>
</svg>
